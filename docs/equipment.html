<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equipment | DMZ Tracker</title>
    <meta name="description" content="Track DMZ equipment upgrades locally in your browser.">
    <link rel="icon" type="image/png" href="./assets/images/dmz-logo-cropped.png">
    <link rel="stylesheet" href="./assets/styles.css">
    <script src="./assets/data/dmz-upgrades.js" defer></script>
    <script src="./assets/js/storage.js" defer></script>
    <script src="./assets/js/shared.js" defer></script>
    <script src="./assets/js/settings.js" defer></script>
    <script src="./assets/js/category.js" defer></script>
  </head>
  <body data-page="category" data-category="equipment">
    <div class="site-shell">
      <header class="site-header">
        <div class="shell-inner site-header__bar">
          <a class="brand" href="./index.html">
            <div class="brand__mark"><img src="./assets/images/dmz-logo-cropped.png" alt=""></div>
            <div>
              <p class="brand__eyebrow">Local progress tracker</p>
              <p class="brand__title">DMZ Upgrades</p>
            </div>
          </a>
          <nav class="site-nav" aria-label="Primary">
            <a class="site-nav__link" href="./index.html">Home</a>
            <a class="site-nav__link" href="./stash.html">Stash</a>
            <a class="site-nav__link" href="./weapons-locker.html">Weapons Locker</a>
            <a class="site-nav__link" href="./bounty-board.html">Bounty Board</a>
            <a class="site-nav__link" href="./communications.html">Communications</a>
            <a class="site-nav__link is-active" href="./equipment.html">Equipment</a>
          </nav>
        </div>
      </header>

      <main class="page">
        <div class="shell-inner">
          <section class="hero">
            <div class="hero__grid">
              <div>
                <p class="eyebrow">Category tracker</p>
                <h1 id="categoryTitle" class="hero__title">Equipment</h1>
                <p id="categoryCopy" class="hero__copy"></p>
                <div class="hero__note"><a href="./index.html">Back to homepage</a></div>
              </div>
              <aside class="hero__panel">
                <p class="hero__panel-title">Category status</p>
                <div id="categoryMeter" class="meter"></div>
              </aside>
            </div>
            <div id="categoryMetrics" class="metric-grid"></div>
          </section>

          <div class="toolbar">
            <div class="toolbar__group">
              <label class="search-field" for="categorySearch">
                <span class="search-field__icon" aria-hidden="true"></span>
                <span class="visually-hidden">Search equipment upgrades</span>
                <input id="categorySearch" type="search" placeholder="Search armor upgrades, gear unlocks, or required items">
              </label>
            </div>
            <div class="toolbar__group">
              <span id="filterMeta" class="chip"></span>
              <button id="settingsButton" class="settings-trigger" type="button" aria-label="Open progress settings" aria-controls="settingsDialog" aria-haspopup="dialog">
                <span class="settings-trigger__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.48.48 0 0 0 .11-.61l-1.92-3.32a.49.49 0 0 0-.58-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94L14.4 2.8a.49.49 0 0 0-.48-.38h-3.84a.49.49 0 0 0-.48.38l-.36 2.55c-.58.23-1.13.54-1.63.94l-2.39-.96a.49.49 0 0 0-.58.22L2.72 8.87a.48.48 0 0 0 .11.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.48.48 0 0 0-.11.61l1.92 3.32c.13.22.39.31.58.22l2.39-.96c.5.4 1.05.72 1.63.94l.36 2.55c.04.24.24.38.48.38h3.84c.24 0 .44-.14.48-.38l.36-2.55c.58-.23 1.13-.54 1.63-.94l2.39.96c.19.09.45 0 .58-.22l1.92-3.32a.48.48 0 0 0-.11-.61l-2.03-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z"></path>
                  </svg>
                </span>
              </button>
            </div>
          </div>

          <section id="categoryGroups" class="group-stack"></section>

          <noscript class="no-script">This tracker needs JavaScript to render the data and save your local progress.</noscript>
        </div>
      </main>

      <footer class="footer">
        <div class="shell-inner footer__inner">
          <div>Equipment progress stays local to this browser.</div>
          <div><a href="./index.html">Return to the dashboard</a></div>
        </div>
      </footer>
    </div>
  </body>
</html>
